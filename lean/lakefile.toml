name = "VeryFPGA"
version = "0.1.0"
defaultTargets = ["VeryFPGA"]

# The netlist the proof is about. Declared as an input so that a changed
# netlist rebuilds VeryFPGA.Blinky and every proof that imports it.
[[input_file]]
name = "blinkyJson"
path = "../build/blinky.json"

# The routed design for M4.
[[input_file]]
name = "blinkyFasm"
path = "../build/blinky.fasm"

# The bitstream for M4b.
[[input_file]]
name = "blinkyBit"
path = "../build/blinky.bit"

[[lean_lib]]
name = "VeryFPGA"
needs = ["blinkyJson", "blinkyFasm", "blinkyBit"]
# Compile the library to native code so that the build-time decoders
# (load_fasm, routing) run compiled instead of in the interpreter.
precompileModules = true
